<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Modal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f2f2;
    }

    /* Open Button */
    #openModal{
      padding:12px 24px;
      font-size:18px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:6px;
      cursor:pointer;
    }

    #openModal:hover{
      background:#0056b3;
    }

    /* Modal Background */
    .modal{
      display:none;
      position:fixed;
      z-index:1000;
      left:0;
      top:0;
      width:100%;
      height:100%;
      background-color:rgba(0,0,0,0.5);

      justify-content:center;
      align-items:center;
    }

    /* Modal Box */
    .modal-content{
      background:white;
      width:400px;
      border-radius:10px;
      overflow:hidden;
      animation:popup 0.3s ease;
    }

    /* Header */
    .modal-header{
      padding:15px 20px;
      background:#007bff;
      color:white;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    /* Close Button */
    .close-modal{
      background:none;
      border:none;
      font-size:24px;
      color:white;
      cursor:pointer;
    }

    /* Body */
    .modal-body{
      padding:25px 20px;
      font-size:18px;
    }

    /* Animation */
    @keyframes popup{
      from{
        transform:scale(0.7);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

  </style>
</head>
<body>

  <!-- Open Modal Button -->
  <button id="openModal">Open Modal</button>

  <!-- Modal -->
  <div class="modal" id="modal">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Modal Header</h2>

        <button class="close-modal">&times;</button>
      </div>

      <div class="modal-body">
        <p>Modal Body Content</p>
      </div>

    </div>

  </div>

  <script>

    const openBtn = document.getElementById("openModal");
    const modal = document.getElementById("modal");
    const closeBtn = document.querySelector(".close-modal");

    // Open Modal
    openBtn.addEventListener("click", () => {
      modal.style.display = "flex";
    });

    // Close Modal using button
    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    // Close Modal when clicked outside
    window.addEventListener("click", (e) => {
      if(e.target === modal){
        modal.style.display = "none";
      }
    });

  </script>

</body>
</html>
